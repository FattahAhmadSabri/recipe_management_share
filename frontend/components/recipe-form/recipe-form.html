<div class="recipe-section">
  <h2>Post A Recipe</h2>

  <form class="recipe-form">
    <div class="form-group">
      <label for="title"> Recipe Name </label>

      <input
        type="text"
        id="title"
        name="title"
        placeholder="Enter recipe name"
      />
    </div>

    <div class="form-group">
      <label for="description"> Description </label>

      <textarea
        id="description"
        name="description"
        placeholder="Describe your recipe..."
      ></textarea>
    </div>

    <div class="form-group">
      <label for="mainIngredients"> Main Ingredients </label>

      <input
        type="text"
        id="mainIngredients"
        name="mainIngredients"
        placeholder="Chicken, Rice, Onion..."
      />
    </div>

    <div class="form-group">
      <label for="recipeTypes"> Recipe Type </label>

      <select id="recipeTypes" name="recipeTypes">
        <option value="">Select recipe type</option>

        <option value="breakfast">Breakfast</option>

        <option value="lunch">Lunch</option>

        <option value="dinner">Dinner</option>

        <option value="dessert">Dessert</option>

        <option value="snacks">Snacks</option>
      </select>
    </div>

    <div class="form-group">
      <label for="method"> Method </label>

      <textarea
        id="method"
        name="method"
        class="method"
        placeholder="Explain how to prepare the recipe..."
      ></textarea>
    </div>

    <div class="form-group">
      <label for="image"> Recipe Image </label>

      <input type="file" id="image" name="file" accept="image/*" />
    </div>

    <button type="submit">Share Recipe</button>
  </form>
</div>
