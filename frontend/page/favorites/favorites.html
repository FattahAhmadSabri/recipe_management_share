<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorite Collection</title>
    <link rel="stylesheet" href="../../css/index.css" />
    <link rel="stylesheet" href="./favorites.css" />
  </head>
  <body>
    <div class="favorite-page">
      <div class="favorite-header-row">
        <a class="back-link" href="../../index.html">Back to home</a>
      </div>

      <h1 class="favorite-page-title">Favorite Collection</h1>

      <form id="create-collection-form" class="collection-create-form">
        <label class="visually-hidden" for="new-collection-name"
          >Collection name</label
        >
        <input
          id="new-collection-name"
          name="name"
          type="text"
          maxlength="100"
          placeholder="Create a collection"
          required
        />
        <button type="submit">Create collection</button>
      </form>

      <nav
        id="collection-list"
        class="collection-list"
        aria-label="Favorite collections"
      ></nav>
      <h2 id="selected-collection-name" class="selected-collection-name"></h2>
      <div id="favorite-status" class="favorite-status">
        Loading favorite recipes...
      </div>
      <div id="favorite-list" class="favorite-grid"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./favorites.js"></script>
  </body>
</html>
