<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authors</title>

    <link rel="stylesheet" href="../../css/index.css" />
    <link rel="stylesheet" href="./author.css" />
  </head>

  <body>
    <div id="header"></div>
    <div id="navbar"></div>

    <main class="page-container">
      <div class="content-layout">
        <section class="main-content">
          <div class="authors-header">
            <h1>Authors</h1>
            <p>
              Meet the cooks and creators sharing recipes with the community.
            </p>
          </div>

          <div class="author-search-wrap">
            <input
              id="authorSearch"
              type="search"
              placeholder="Search author by name"
              aria-label="Search author by name"
            />
          </div>

          <div class="author-header-actions">
            <a class="secondary-btn" href="./page/authors/followinglist.html">
              View Following Authors
            </a>
          </div>

          <div id="loading" class="loading">Loading authors...</div>
          <div id="error" class="error-message"></div>

          <!-- All Authors: GET /user -->
          <div
            class="authors-panel"
            id="allAuthorsSection"
            role="tabpanel"
            aria-labelledby="allAuthorsTab"
          >
            <div id="allAuthorsList" class="authors-list"></div>
          </div>

          <!-- Following Authors: GET /following/me -->
          <div
            class="authors-panel"
            id="followingAuthorsSection"
            role="tabpanel"
            aria-labelledby="followingAuthorsTab"
            hidden
          >
            <div id="followedAuthorsList" class="authors-list"></div>
          </div>
        </section>

        <div id="sidebar"></div>
      </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="./author.js"></script>

    <!-- Tab Switching -->
    <script>
      const authorTabs = document.querySelectorAll(".author-tab");

      const allAuthorsSection = document.getElementById("allAuthorsSection");

      const followingAuthorsSection = document.getElementById(
        "followingAuthorsSection",
      );

      authorTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const showAll = tab.dataset.tab === "all";

          authorTabs.forEach((item) => {
            const isActive = item === tab;

            item.classList.toggle("active", isActive);
            item.setAttribute("aria-selected", String(isActive));
          });

          allAuthorsSection.hidden = !showAll;
          followingAuthorsSection.hidden = showAll;
        });
      });
    </script>
  </body>
</html>
